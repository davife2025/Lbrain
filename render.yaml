services:
  - type: web
    name: lbrain-server
    runtime: node
    rootDir: apps/server
    buildCommand: npm install --ignore-scripts && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: SERVER_SECRET
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENCLAW_SECRET
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
